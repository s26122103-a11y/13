<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日系簡約風迷因產生器 | Meme Generator</title>

  <!-- 引入 Google Fonts：日系圓體 (Zen Maru Gothic) 與 Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

  <!-- 引入 Tailwind CSS 快速樣式庫 -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 引入 html2canvas 截圖下載庫 (處理畫面轉圖片) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- 自訂 CSS 樣式：日系配色與字體細節 -->
  <style>
    /* 全局背景與字型設定 */
    body {
      font-family: 'Zen Maru Gothic', 'Noto Sans JP', sans-serif;
      background-color: #fcfbf7; /* 日系米白和紙色 */
      color: #4a4646; /* 溫和墨灰字體，非死黑 */
    }

    /* 迷因文字的黑色粗邊框描邊，確保任何底圖都能看清 */
    .meme-text-stroke {
      color: #ffffff;
      text-shadow: 
        2px 2px 0 #000,
       -2px 2px 0 #000,
        2px -2px 0 #000,
       -2px -2px 0 #000,
        0px 2px 0 #000,
        0px -2px 0 #000,
        2px 0px 0 #000,
       -2px 0px 0 #000,
        3px 3px 5px rgba(0,0,0,0.8);
      font-weight: 900;
      word-break: break-word;
    }

    /* 日系客製化滑桿軌道與圓點樣式 */
    input[type=range] {
      -webkit-appearance: none;
      background: #e2ded7;
      height: 6px;
      border-radius: 5px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #8c7b6b; /* 奶茶日系色 */
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: transform 0.1s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* 日系精緻卡片邊框與陰影 */
    .jp-card {
      background: #ffffff;
      border: 1px solid #efebe4;
      box-shadow: 0 10px 25px -5px rgba(140, 123, 107, 0.08);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

  <!-- 頂部標題區 -->
  <header class="max-w-6xl mx-auto w-full mb-6 text-center">
    <div class="inline-block bg-stone-200/60 text-stone-600 px-3 py-1 rounded-full text-xs font-bold tracking-widest mb-2">
      SIMPLE & MINIMALIST
    </div>
    <h1 class="text-2xl md:text-3xl font-black text-stone-700 tracking-wide">
      ミーム生成器 <span class="text-sm font-normal text-stone-400 block md:inline md:ml-2">日系簡約迷因產生器</span>
    </h1>
  </header>

  <!-- 主要內容區：左側/上方控制區，右側/下方預覽區 -->
  <main class="max-w-6xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-start flex-1">
    
    <!-- 1. 控制面板區域 (PC在左，手機在下/或排前面) -->
    <section class="lg:col-span-5 jp-card rounded-2xl p-6 flex flex-col gap-5 order-2 lg:order-1">
      <h2 class="text-lg font-bold border-b border-stone-200 pb-2 flex items-center gap-2 text-stone-700">
        <span class="w-2.5 h-2.5 rounded-full bg-stone-400 inline-block"></span>
        控制選單 (Controls)
      </h2>

      <!-- (A) 本機圖片上傳 -->
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-bold text-stone-600">上傳底圖 (Select Image)</label>
        <label for="image-upload" class="flex items-center justify-center gap-2 w-full p-3 border-2 border-dashed border-stone-300 rounded-xl cursor-pointer hover:border-stone-500 hover:bg-stone-50 transition text-stone-500 text-sm font-medium">
          <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          點擊選擇電腦中的圖片...
        </label>
        <!-- 真正的檔案輸入框 (隱藏) -->
        <input type="file" id="image-upload" accept="image/*" class="hidden">
      </div>

      <!-- (B) 文字輸入框 -->
      <div class="space-y-3">
        <div>
          <label for="top-text-input" class="block text-sm font-bold text-stone-600 mb-1">上方文字 (Top Text)</label>
          <input type="text" id="top-text-input" value="當你寫的程式" placeholder="請輸入上方文字..." class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-stone-400">
        </div>
        <div>
          <label for="bottom-text-input" class="block text-sm font-bold text-stone-600 mb-1">下方文字 (Bottom Text)</label>
          <input type="text" id="bottom-text-input" value="一次就成功過關時" placeholder="請輸入下方文字..." class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-stone-400">
        </div>
      </div>

      <!-- (C) 參數微調滑桿 -->
      <div class="space-y-4 pt-2 border-t border-stone-100">
        <!-- 1. 字體大小 -->
        <div>
          <div class="flex justify-between text-xs font-bold text-stone-600 mb-1">
            <span>字體大小 (Font Size)</span>
            <span id="font-size-val">36 px</span>
          </div>
          <input type="range" id="font-size-slider" min="16" max="72" value="36" class="w-full">
        </div>

        <!-- 2. 上方文字垂直位置 -->
        <div>
          <div class="flex justify-between text-xs font-bold text-stone-600 mb-1">
            <span>上方文字垂直位置 (Top Pos)</span>
            <span id="top-pos-val">5 %</span>
          </div>
          <input type="range" id="top-pos-slider" min="0" max="45" value="5" class="w-full">
        </div>

        <!-- 3. 下方文字垂直位置 -->
        <div>
          <div class="flex justify-between text-xs font-bold text-stone-600 mb-1">
            <span>下方文字垂直位置 (Bottom Pos)</span>
            <span id="bottom-pos-val">5 %</span>
          </div>
          <input type="range" id="bottom-pos-slider" min="0" max="45" value="5" class="w-full">
        </div>
      </div>

      <!-- (D) 下載按鈕 -->
      <button id="download-btn" class="w-full mt-2 py-3 bg-stone-700 hover:bg-stone-800 text-white font-bold rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        下載迷因圖档 (Download PNG)
      </button>
    </section>

    <!-- 2. 迷因即時預覽區域 (PC在右，手機在上) -->
    <section class="lg:col-span-7 flex flex-col items-center justify-center order-1 lg:order-2">
      <div class="w-full flex justify-between items-center mb-2 px-1">
        <span class="text-xs font-bold text-stone-400">PREVIEW AREA</span>
        <span class="text-xs text-stone-400">即時預覽區</span>
      </div>

      <!-- 即時擷取的容器 (截圖時會擷取這個區塊) -->
      <div id="meme-container" class="relative w-full max-w-[550px] overflow-hidden rounded-xl bg-stone-200 border-2 border-stone-300 shadow-lg flex items-center justify-center select-none">
        
        <!-- 底圖圖片 -->
        <img id="meme-image" src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=800&q=80" alt="Meme Background" class="w-full h-auto block object-cover max-h-[70vh]">

        <!-- 上方文字 -->
        <div id="top-text-display" class="meme-text-stroke absolute w-11/12 text-center uppercase tracking-wider leading-tight" style="top: 5%; font-size: 36px;">
          驚不驚喜
        </div>

        <!-- 下方文字 -->
        <div id="bottom-text-display" class="meme-text-stroke absolute w-11/12 text-center uppercase tracking-wider leading-tight" style="bottom: 5%; font-size: 36px;">
          給我起床了!
        </div>

      </div>
    </section>

  </main>

  <!-- 頁腳 -->
  <footer class="max-w-6xl mx-auto w-full text-center mt-8 py-4 border-t border-stone-200 text-xs text-stone-400">
    Designed with Japanese Minimalist Aesthetics • Meme Generator
  </footer>

  <!-- JavaScript 邏輯控制 -->
  <script>
    // ----------------------------------------------------
    // 1. 取得 DOM HTML 元素
    // ----------------------------------------------------
    const imageUpload = document.getElementById('image-upload');
    const memeImage = document.getElementById('meme-image');

    const topTextInput = document.getElementById('top-text-input');
    const bottomTextInput = document.getElementById('bottom-text-input');
    const topTextDisplay = document.getElementById('top-text-display');
    const bottomTextDisplay = document.getElementById('bottom-text-display');

    const fontSizeSlider = document.getElementById('font-size-slider');
    const topPosSlider = document.getElementById('top-pos-slider');
    const bottomPosSlider = document.getElementById('bottom-pos-slider');

    const fontSizeVal = document.getElementById('font-size-val');
    const topPosVal = document.getElementById('top-pos-val');
    const bottomPosVal = document.getElementById('bottom-pos-val');

    const memeContainer = document.getElementById('meme-container');
    const downloadBtn = document.getElementById('download-btn');

    // ----------------------------------------------------
    // 2. 本地圖片讀取 (FileReader API) - 防 CORS 跨域必備
    // ----------------------------------------------------
    imageUpload.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        // 使用 FileReader 讀取使用者電腦內的圖檔並轉成 Base64 DataURL
        const reader = new FileReader();
        reader.onload = function(event) {
          memeImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // ----------------------------------------------------
    // 3. 文字即時同步顯示
    // ----------------------------------------------------
    topTextInput.addEventListener('input', () => {
      topTextDisplay.textContent = topTextInput.value || ' ';
    });

    bottomTextInput.addEventListener('input', () => {
      bottomTextDisplay.textContent = bottomTextInput.value || ' ';
    });

    // ----------------------------------------------------
    // 4. 滑桿參數即時微調 (字體大小、上下位置)
    // ----------------------------------------------------
    fontSizeSlider.addEventListener('input', () => {
      const val = fontSizeSlider.value;
      fontSizeVal.textContent = val + ' px';
      topTextDisplay.style.fontSize = val + 'px';
      bottomTextDisplay.style.fontSize = val + 'px';
    });

    topPosSlider.addEventListener('input', () => {
      const val = topPosSlider.value;
      topPosVal.textContent = val + ' %';
      topTextDisplay.style.top = val + '%';
    });

    bottomPosSlider.addEventListener('input', () => {
      const val = bottomPosSlider.value;
      bottomPosVal.textContent = val + ' %';
      bottomTextDisplay.style.bottom = val + '%';
    });

    // ----------------------------------------------------
    // 5. 一鍵下載圖片 (html2canvas 功能)
    // ----------------------------------------------------
    downloadBtn.addEventListener('click', () => {
      // 更改按鈕文字提示正在處理
      const originalText = downloadBtn.innerHTML;
      downloadBtn.innerHTML = '生成中 Processing...';
      downloadBtn.disabled = true;

      // 使用 html2canvas 將 memeContainer 轉為 Canvas
      html2canvas(memeContainer, {
        useCORS: true,       // 允許跨域圖片渲染
        scale: 2,            // 提升下載圖片的解析度 (放大2倍)
        backgroundColor: null // 保持透明背景
      }).then(canvas => {
        // 將 Canvas 轉成圖片 Data URL 並建立隱藏的 <a> 標籤進行下載
        const link = document.createElement('a');
        link.download = 'my-meme.png';
        link.href = canvas.toDataURL('image/png');
        link.click();

        // 恢復按鈕狀態
        downloadBtn.innerHTML = originalText;
        downloadBtn.disabled = false;
      }).catch(err => {
        console.error('下載圖片失敗:', err);
        alert('圖片下載失敗，請嘗試使用本機上傳圖片。');
        downloadBtn.innerHTML = originalText;
        downloadBtn.disabled = false;
      });
    });
  </script>
</body>
</html>
