<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃甚麼？ - 交通號誌抽籤機</title>
    
    <!-- CSS 交通號誌視覺風格與動畫 -->
    <style>
        /* 全局樣式：深色瀝青路面感 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial Black', 'Impact', sans-serif, "微軟正黑體";
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
            background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#222 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: #ffffff;
            padding: 20px;
        }

        /* 交通號誌指示牌卡片 */
        .traffic-sign {
            background: #111111;
            border: 8px solid #facc15; /* 標誌金黃粗框 */
            border-radius: 28px;
            padding: 35px 25px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8),
                        0 0 20px rgba(250, 204, 21, 0.2);
            position: relative;
            overflow: hidden;
        }

        /* 警示線條條紋 */
        .stripe-bar {
            height: 12px;
            width: 100%;
            background: repeating-linear-gradient(
                -45deg,
                #facc15,
                #facc15 15px,
                #111 15px,
                #111 30px
            );
            margin-bottom: 20px;
            border-radius: 6px;
        }

        /* 交通號誌紅綠燈 */
        .traffic-lights {
            display: flex;
            justify-content: center;
            gap: 15px;
            background: #222;
            padding: 10px 20px;
            border-radius: 30px;
            width: fit-content;
            margin: 0 auto 20px auto;
            border: 3px solid #444;
        }

        .light {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            opacity: 0.3;
            transition: opacity 0.3s, box-shadow 0.3s;
        }

        .light.red { background-color: #ef4444; }
        .light.yellow { background-color: #f59e0b; }
        .light.green { background-color: #10b981; }

        .light.active {
            opacity: 1;
            box-shadow: 0 0 15px currentColor;
        }

        /* 標題與路牌文字樣式 */
        .title {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 3px 3px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
            margin-bottom: 20px;
            letter-spacing: 1px;
            word-break: break-all;
        }

        /* 圖片外框（模仿交通告示板） */
        .image-container {
            width: 100%;
            height: 220px;
            margin-bottom: 25px;
            border-radius: 16px;
            overflow: hidden;
            border: 4px solid #ffffff;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 按鈕組與按鈕風格 */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: 900;
            border-radius: 14px;
            cursor: pointer;
            text-decoration: none;
            text-transform: uppercase;
            transition: all 0.2s ease;
            box-shadow: 0 6px 0px rgba(0, 0, 0, 0.4);
        }

        /* 主要抽籤按鈕（警告黃底黑字風格） */
        .btn-primary {
            background-color: #facc15;
            color: #111111;
            border: 3px solid #eab308;
        }

        .btn-primary:hover {
            background-color: #fde047;
            transform: translateY(-2px);
            box-shadow: 0 8px 0px rgba(0, 0, 0, 0.4);
        }

        .btn-primary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px rgba(0, 0, 0, 0.4);
        }

        /* 馬上出發按鈕（指示綠牌風格） */
        .btn-secondary {
            background-color: #10b981;
            color: #ffffff;
            border: 3px solid #059669;
        }

        .btn-secondary:hover {
            background-color: #34d399;
            transform: translateY(-2px);
            box-shadow: 0 8px 0px rgba(0, 0, 0, 0.4);
        }

        .btn-secondary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px rgba(0, 0, 0, 0.4);
        }

        /* 工具類別：隱藏元素 */
        .hidden {
            display: none !important;
        }

        /* 生動彈跳動畫 (Bounce Animation) */
        .bounce-animation {
            animation: signBounce 0.65s cubic-bezier(0.36, 0, 0.66, -0.56);
            animation-fill-mode: forwards;
        }

        @keyframes signBounce {
            0% {
                opacity: 0;
                transform: scale(0.3) translateY(-60px);
            }
            50% {
                opacity: 1;
                transform: scale(1.2) translateY(15px);
            }
            75% {
                transform: scale(0.9) translateY(-8px);
            }
            100% {
                transform: scale(1) translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- 道路指示牌外框容器 -->
    <div class="traffic-sign">
        <!-- 上方黑黃警示條紋 -->
        <div class="stripe-bar"></div>

        <!-- 交通號誌燈號區 -->
        <div class="traffic-lights">
            <span class="light red" id="light-red"></span>
            <span class="light yellow" id="light-yellow"></span>
            <span class="light green" id="light-green"></span>
        </div>

        <!-- 大標題區塊 -->
        <h1 id="title" class="title">今天吃甚麼？</h1>

        <!-- 照片顯示區域 (預設隱藏) -->
        <div id="image-container" class="image-container hidden">
            <img id="food-image" src="" alt="美食照片">
        </div>

        <!-- 按鈕區域 -->
        <div class="button-group">
            <button id="draw-btn" class="btn btn-primary">🚦 點我抽籤</button>
            <a id="map-link" href="#" target="_blank" class="btn btn-secondary hidden">🗺️ 馬上出發</a>
        </div>
    </div>

    <!-- JavaScript 抽籤邏輯與號誌聯動 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. 食物選項清單
            const foodList = [
                {
                    name: "品香",
                    image: "https://i.postimg.cc/DyGwCTWt/Screenshot-20260921-132036-Maps.jpg",
                    mapQuery: "品香平價自助餐 樹德橫山路82號"
                },
                {
                    name: "7-11",
                    image: "https://i.postimg.cc/9MzWy5H5/Screenshot-20260921-132237-Maps.jpg",
                    mapQuery: "7-ELEVEN 樹科門市"
                },
                {
                    name: "咖哩飯",
                    image: "https://i.postimg.cc/PfpDk0pw/Screenshot-20260921-132904-Maps.jpg",
                    mapQuery: "THE T café 樹德科大店 / TKS FULL HOUSE series"
                },
                {
                    name: "燒肉飯",
                    image: "https://i.postimg.cc/mkvM0yyx/Screenshot-20260921-132917-Maps.jpg",
                    mapQuery: "元泰燒肉飯"
                },
                {
                    name: "水餃",
                    image: "https://images.unsplash.com/photo-1496116218417-1a781b1c416c?auto=format&fit=crop&w=800&q=80",
                    mapQuery: "八方雲集-高雄楠梓店"
                }
            ];

            // 2. 獲取頁面上的 HTML 元素
            const titleElement = document.getElementById('title');
            const drawBtn = document.getElementById('draw-btn');
            const imageContainer = document.getElementById('image-container');
            const foodImage = document.getElementById('food-image');
            const mapLink = document.getElementById('map-link');

            const lightRed = document.getElementById('light-red');
            const lightYellow = document.getElementById('light-yellow');
            const lightGreen = document.getElementById('light-green');

            // 3. 點擊抽籤按鈕觸發事件
            drawBtn.addEventListener('click', () => {
                // 切換燈號：先亮黃燈
                lightRed.classList.remove('active');
                lightGreen.classList.remove('active');
                lightYellow.classList.add('active');

                // 隨機選取食物
                const randomIndex = Math.floor(Math.random() * foodList.length);
                const selectedFood = foodList[randomIndex];

                // 重置動畫效果
                titleElement.classList.remove('bounce-animation');
                void titleElement.offsetWidth; // 觸發瀏覽器重繪 (Reflow)

                // 替換大標題與套用生動彈跳動畫
                titleElement.textContent = `🚥 前方抵達：${selectedFood.name}！`;
                titleElement.classList.add('bounce-animation');

                // 顯示照片與切換綠燈
                foodImage.src = selectedFood.image;
                foodImage.alt = selectedFood.name;
                imageContainer.classList.remove('hidden');

                lightYellow.classList.remove('active');
                lightGreen.classList.add('active');

                // 設定並顯示 Google Maps 按鈕
                mapLink.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(selectedFood.mapQuery)}`;
                mapLink.classList.remove('hidden');
            });
        });
    </script>

</body>
</html>
